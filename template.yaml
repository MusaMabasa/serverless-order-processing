AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Serverless Order Processing System using Amazon Cognito,
  API Gateway, AWS Lambda, Amazon SQS, DynamoDB,
  CloudWatch, SNS and AWS SAM.

Parameters:
  AlertEmail:
    Type: String
    Description: Email address that receives CloudWatch alarm notifications

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - x86_64
    MemorySize: 128
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        AWS_REGION_NAME: !Ref AWS::Region

Resources:

  # =======================================================
  # COGNITO USER POOL
  # =======================================================

  OrderUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: serverless-order-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true

  # =======================================================
  # COGNITO APP CLIENT
  # =======================================================

  OrderUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: serverless-order-client
      UserPoolId: !Ref OrderUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # =======================================================
  # API GATEWAY ACCESS LOG GROUP
  # =======================================================

  OrderApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/apigateway/serverless-order-api
      RetentionInDays: 14

  # =======================================================
  # API GATEWAY
  # =======================================================

  OrderApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: serverless-order-api
      StageName: Prod
      EndpointConfiguration:
        Type: REGIONAL

      AccessLogSetting:
        DestinationArn: !GetAtt OrderApiAccessLogGroup.Arn
        Format: >
          { "requestId":"$context.requestId",
          "ip":"$context.identity.sourceIp",
          "requestTime":"$context.requestTime",
          "httpMethod":"$context.httpMethod",
          "resourcePath":"$context.resourcePath",
          "status":"$context.status",
          "responseLength":"$context.responseLength",
          "responseLatency":"$context.responseLatency",
          "integrationLatency":"$context.integrationLatency",
          "integrationError":"$context.integrationErrorMessage" }

      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
          MetricsEnabled: true

      Models:
        OrderRequest:
          type: object
          required:
            - customer_name
            - customer_email
            - items
          additionalProperties: false
          properties:
            customer_name:
              type: string
              minLength: 1
            customer_email:
              type: string
              minLength: 1
            items:
              type: array
              minItems: 1
              items:
                type: object
                required:
                  - product
                  - quantity
                  - price
                additionalProperties: false
                properties:
                  product:
                    type: string
                    minLength: 1
                  quantity:
                    type: integer
                    minimum: 1
                  price:
                    type: number
                    minimum: 0

      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt OrderUserPool.Arn

  # =======================================================
  # DEAD LETTER QUEUE
  # =======================================================

  OrderDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: serverless-order-dlq
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  # =======================================================
  # MAIN ORDER QUEUE
  # =======================================================

  OrderQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: serverless-order-queue
      VisibilityTimeout: 60
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrderDeadLetterQueue.Arn
        maxReceiveCount: 3

  # =======================================================
  # DYNAMODB TABLE
  # =======================================================

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ServerlessOrders
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: order_id
          AttributeType: S
      KeySchema:
        - AttributeName: order_id
          KeyType: HASH

  # =======================================================
  # CREATE ORDER LAMBDA
  # API GATEWAY -> LAMBDA -> SQS
  # =======================================================

  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: serverless-create-order
      CodeUri: backend/create_order/
      Handler: app.lambda_handler

      Environment:
        Variables:
          ORDER_QUEUE_URL: !Ref OrderQueue

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt OrderQueue.Arn

      Events:
        CreateOrderApi:
          Type: Api
          Properties:
            RestApiId: !Ref OrderApi
            Path: /orders
            Method: POST
            RequestModel:
              Model: OrderRequest
              Required: true
              ValidateBody: true

  # =======================================================
  # GET ORDERS LAMBDA
  # API GATEWAY -> LAMBDA -> DYNAMODB
  # =======================================================

  GetOrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: serverless-get-orders
      CodeUri: backend/get_orders/
      Handler: app.lambda_handler

      Environment:
        Variables:
          ORDERS_TABLE: !Ref OrdersTable

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt OrdersTable.Arn

      Events:
        GetOrdersApi:
          Type: Api
          Properties:
            RestApiId: !Ref OrderApi
            Path: /orders
            Method: GET


  # =======================================================
  # GET SINGLE ORDER LAMBDA
  # API GATEWAY -> LAMBDA -> DYNAMODB
  # =======================================================

  GetOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: serverless-get-order
      CodeUri: backend/get_order/
      Handler: app.lambda_handler

      Environment:
        Variables:
          ORDERS_TABLE: !Ref OrdersTable

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt OrdersTable.Arn

      Events:
        GetOrderApi:
          Type: Api
          Properties:
            RestApiId: !Ref OrderApi
            Path: /orders/{order_id}
            Method: GET

  # =======================================================
  # UPDATE ORDER LAMBDA
  # PATCH /orders/{order_id}
  # =======================================================

  UpdateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: serverless-update-order
      CodeUri: backend/update_order/
      Handler: app.lambda_handler

      Environment:
        Variables:
          ORDERS_TABLE: !Ref OrdersTable

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt OrdersTable.Arn

      Events:
        UpdateOrderApi:
          Type: Api
          Properties:
            RestApiId: !Ref OrderApi
            Path: /orders/{order_id}
            Method: PATCH

  # =======================================================
  # PROCESS ORDER LAMBDA
  # SQS -> LAMBDA -> DYNAMODB
  # =======================================================

  ProcessOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: serverless-process-order
      CodeUri: backend/process_order/
      Handler: app.lambda_handler

      Environment:
        Variables:
          ORDERS_TABLE: !Ref OrdersTable

      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt OrderQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt OrdersTable.Arn

      Events:
        OrderQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt OrderQueue.Arn
            BatchSize: 1

  # =======================================================
  # SNS ALERT TOPIC
  # =======================================================

  OrderAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: serverless-order-alerts

  OrderAlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OrderAlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # =======================================================
  # CREATE ORDER LAMBDA ERROR ALARM
  # =======================================================

  CreateOrderErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: serverless-create-order-errors
      AlarmDescription: >
        Alarm when the Create Order Lambda function reports errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: serverless-create-order
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OrderAlertsTopic

  # =======================================================
  # GET ORDERS LAMBDA ERROR ALARM
  # =======================================================

  GetOrdersErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: serverless-get-orders-errors
      AlarmDescription: >
        Alarm when the Get Orders Lambda function reports errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: serverless-get-orders
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OrderAlertsTopic


  # =======================================================
  # GET SINGLE ORDER LAMBDA ERROR ALARM
  # =======================================================

  GetOrderErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: serverless-get-order-errors
      AlarmDescription: >
        Alarm when the Get Order Lambda function reports errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: serverless-get-order
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OrderAlertsTopic

  # =======================================================
  # UPDATE ORDER LAMBDA ERROR ALARM
  # =======================================================

  UpdateOrderErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: serverless-update-order-errors
      AlarmDescription: >
        Alarm when the Update Order Lambda function reports errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: serverless-update-order
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OrderAlertsTopic

  # =======================================================
  # PROCESS ORDER LAMBDA ERROR ALARM
  # =======================================================

  ProcessOrderErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: serverless-process-order-errors
      AlarmDescription: >
        Alarm when the Process Order Lambda function reports errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: serverless-process-order
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OrderAlertsTopic

  # =======================================================
  # DLQ MESSAGE ALARM
  # =======================================================

  OrderDLQMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: serverless-order-dlq-messages
      AlarmDescription: >
        Alarm when one or more messages are visible in the
        serverless order dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt OrderDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OrderAlertsTopic

  # =======================================================
  # MAIN QUEUE BACKLOG ALARM
  # =======================================================

  OrderQueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: serverless-order-queue-backlog
      AlarmDescription: >
        Alarm when too many orders are waiting in the
        main SQS queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt OrderQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OrderAlertsTopic

  # =======================================================
  # API GATEWAY 5XX ALARM
  # =======================================================

  Api5xxErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: serverless-api-5xx-errors
      AlarmDescription: >
        Alarm when API Gateway returns server errors.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: serverless-order-api
        - Name: Stage
          Value: Prod
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OrderAlertsTopic

  # =======================================================
  # API GATEWAY 4XX ALARM
  # =======================================================

  Api4xxErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: serverless-api-4xx-errors
      AlarmDescription: >
        Alarm when API Gateway returns an unusually high
        number of client errors.
      Namespace: AWS/ApiGateway
      MetricName: 4XXError
      Dimensions:
        - Name: ApiName
          Value: serverless-order-api
        - Name: Stage
          Value: Prod
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OrderAlertsTopic

  # =======================================================
  # API GATEWAY HIGH LATENCY ALARM
  # =======================================================

  ApiHighLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: serverless-api-high-latency
      AlarmDescription: >
        Alarm when average API Gateway latency becomes high.
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiName
          Value: serverless-order-api
        - Name: Stage
          Value: Prod
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 2000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OrderAlertsTopic

  # =======================================================
  # CLOUDWATCH DASHBOARD
  # =======================================================

  OrderProcessingDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: serverless-order-processing-dashboard

      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 2,
              "properties": {
                "markdown": "# Serverless Order Processing Dashboard\nOperational monitoring for API Gateway, Lambda, SQS and DynamoDB."
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 2,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "API Gateway Requests",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Sum",
                "period": 60,
                "metrics": [
                  [
                    "AWS/ApiGateway",
                    "Count",
                    "ApiName",
                    "serverless-order-api",
                    "Stage",
                    "Prod"
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 2,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "API Gateway Errors",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Sum",
                "period": 60,
                "metrics": [
                  [
                    "AWS/ApiGateway",
                    "4XXError",
                    "ApiName",
                    "serverless-order-api",
                    "Stage",
                    "Prod"
                  ],
                  [
                    ".",
                    "5XXError",
                    ".",
                    ".",
                    ".",
                    "."
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 2,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "API Gateway Latency",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Average",
                "period": 60,
                "metrics": [
                  [
                    "AWS/ApiGateway",
                    "Latency",
                    "ApiName",
                    "serverless-order-api",
                    "Stage",
                    "Prod"
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 8,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda Invocations",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Sum",
                "period": 60,
                "metrics": [
                  [
                    "AWS/Lambda",
                    "Invocations",
                    "FunctionName",
                    "serverless-create-order"
                  ],
                  [
                    ".",
                    ".",
                    ".",
                    "serverless-get-orders"
                  ],
                  [
                    ".",
                    ".",
                    ".",
                    "serverless-process-order"
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 8,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda Errors",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Sum",
                "period": 60,
                "metrics": [
                  [
                    "AWS/Lambda",
                    "Errors",
                    "FunctionName",
                    "serverless-create-order"
                  ],
                  [
                    ".",
                    ".",
                    ".",
                    "serverless-get-orders"
                  ],
                  [
                    ".",
                    ".",
                    ".",
                    "serverless-process-order"
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 14,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "SQS Queue Depth",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Maximum",
                "period": 60,
                "metrics": [
                  [
                    "AWS/SQS",
                    "ApproximateNumberOfMessagesVisible",
                    "QueueName",
                    "serverless-order-queue"
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 14,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "Dead Letter Queue",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Maximum",
                "period": 60,
                "metrics": [
                  [
                    "AWS/SQS",
                    "ApproximateNumberOfMessagesVisible",
                    "QueueName",
                    "serverless-order-dlq"
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 14,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "DynamoDB Activity",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Sum",
                "period": 60,
                "metrics": [
                  [
                    "AWS/DynamoDB",
                    "ConsumedWriteCapacityUnits",
                    "TableName",
                    "ServerlessOrders"
                  ],
                  [
                    ".",
                    "ConsumedReadCapacityUnits",
                    ".",
                    "."
                  ]
                ]
              }
            }
          ]
        }


  # =======================================================
  # AWS WAF WEB ACL
  # PROTECTS REGIONAL API GATEWAY
  # =======================================================

  OrderWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: serverless-order-api-waf
      Description: "AWS WAF protection for the Serverless Order Processing API."
      Scope: REGIONAL

      DefaultAction:
        Allow: {}

      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: serverless-order-api-waf
        SampledRequestsEnabled: true

      Rules:

        # ---------------------------------------------------
        # AWS MANAGED COMMON RULE SET
        # ---------------------------------------------------

        - Name: AWSManagedRulesCommonRuleSet
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: aws-managed-common-rules
            SampledRequestsEnabled: true

        # ---------------------------------------------------
        # AWS MANAGED KNOWN BAD INPUTS
        # ---------------------------------------------------

        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: aws-managed-known-bad-inputs
            SampledRequestsEnabled: true

        # ---------------------------------------------------
        # AMAZON IP REPUTATION LIST
        # ---------------------------------------------------

        - Name: AWSManagedRulesAmazonIpReputationList
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: aws-managed-ip-reputation
            SampledRequestsEnabled: true

        # ---------------------------------------------------
        # RATE-BASED PROTECTION
        #
        # Blocks an IP when it exceeds 500 requests during
        # the WAF rate evaluation window.
        # ---------------------------------------------------

        - Name: ApiRateLimit
          Priority: 3
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 500
              AggregateKeyType: IP
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: serverless-order-api-rate-limit
            SampledRequestsEnabled: true

  # =======================================================
  # WAF ASSOCIATION
  # WEB ACL -> API GATEWAY PROD STAGE
  # =======================================================

  OrderWebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    DependsOn:
      - OrderApiProdStage
    Properties:
      WebACLArn: !GetAtt OrderWebACL.Arn
      ResourceArn: !Sub
        - "arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${ApiId}/stages/Prod"
        - ApiId: !Ref OrderApi

Outputs:

  OrderApiUrl:
    Description: Serverless Order Processing API URL
    Value: !Sub "https://${OrderApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/orders"

  OrderApiId:
    Description: API Gateway REST API ID
    Value: !Ref OrderApi

  OrderUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref OrderUserPool

  OrderUserPoolClientId:
    Description: Cognito User Pool App Client ID
    Value: !Ref OrderUserPoolClient

  OrderQueueUrl:
    Description: Main SQS queue URL
    Value: !Ref OrderQueue

  OrderQueueArn:
    Description: Main SQS queue ARN
    Value: !GetAtt OrderQueue.Arn

  OrderDeadLetterQueueUrl:
    Description: Dead-Letter Queue URL
    Value: !Ref OrderDeadLetterQueue

  OrdersTableName:
    Description: DynamoDB Orders table
    Value: !Ref OrdersTable

  GetOrderFunctionName:
    Description: Get Single Order Lambda function
    Value: !Ref GetOrderFunction

  UpdateOrderFunctionName:
    Description: Update Order Lambda function
    Value: !Ref UpdateOrderFunction

  CreateOrderFunctionName:
    Description: Create Order Lambda function
    Value: !Ref CreateOrderFunction

  GetOrdersFunctionName:
    Description: Get Orders Lambda function
    Value: !Ref GetOrdersFunction

  ProcessOrderFunctionName:
    Description: Process Order Lambda function
    Value: !Ref ProcessOrderFunction

  OrderAlertsTopicArn:
    Description: SNS operational alert topic
    Value: !Ref OrderAlertsTopic

  DashboardName:
    Description: CloudWatch dashboard
    Value: serverless-order-processing-dashboard
